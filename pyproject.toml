[project]
name = "qa-agent"
version = "0.1.0"
description = "QA agent built with LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
qa-agent = "qa_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_agent"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]
